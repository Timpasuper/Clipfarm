<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipfarm AI - Professional Short-Form Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070510;
      --panel-bg: rgba(18, 14, 33, 0.75);
      --border-color: rgba(139, 92, 246, 0.2);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #space-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .hero-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .hero-container.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }

    .hero-box {
      background: rgba(15, 11, 28, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.25), inset 0 0 20px rgba(139, 92, 246, 0.1);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 48px;
      max-width: 650px;
      width: 100%;
      text-align: center;
    }

    .hero-box h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .hero-box p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 32px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 18px 20px;
      background: rgba(7, 5, 16, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    .btn-analyze {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      animation: pulseGlow 2s infinite;
      transition: transform 0.2s;
    }

    .btn-analyze:hover { transform: translateY(-2px); }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
      50% { box-shadow: 0 0 35px rgba(6, 182, 212, 0.7); }
    }

    .app-workspace {
      position: relative;
      z-index: 10;
      display: flex;
      height: 100vh;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .app-workspace.active {
      opacity: 1;
      pointer-events: all;
    }

    .side-panel {
      width: 440px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 24px;
    }

    .panel-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clip-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clip-card:hover, .clip-card.active {
      border-color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.1);
    }

    .clip-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .clip-title { font-weight: 700; font-size: 0.95rem; }
    .viral-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
