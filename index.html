<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipfarm AI - Short-Form Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070510;
      --panel-bg: rgba(18, 14, 33, 0.85);
      --border-color: rgba(139, 92, 246, 0.25);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #space-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* LANDING SCREEN */
    .hero-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .hero-container.hidden { display: none !important; }

    .hero-box {
      background: rgba(15, 11, 28, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.25);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 48px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .hero-box h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .hero-box p { color: var(--text-muted); font-size: 1rem; margin-bottom: 32px; }

    .input-wrapper input {
      width: 100%;
      padding: 18px 20px;
      background: rgba(7, 5, 16, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
    }

    .btn-analyze {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    /* WORKSPACE SCREEN */
    .app-workspace {
      position: relative;
      z-index: 10;
      display: none;
      height: 100vh;
    }

    .app-workspace.active { display: flex !important; }

    .side-panel {
      width: 420px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 24px;
    }

    .panel-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .clip-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .clip-card.active { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.1); }
    .viral-badge { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; font-size: 0.75rem; padding: 2px 8px; border-radius: 20px; font-weight: 700; }

    .captions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .cap-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cap-btn.selected { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.2); }

    .layout-opt {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .layout-opt.selected { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.2); }

    .main-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .phone-stage {
      width: 320px;
      height: 580px;
      background: #000;
      border-radius: 28px;
      border: 4px solid #1e1b2e;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .yt-frame-container {
      position: relative;
      width: 100%;
      height: 50%;
      background: #111;
    }

    iframe#yt-iframe { width: 100%; height: 100%; border: none; }

    .subtitle-overlay {
      position: absolute;
      bottom: 12px;
      left: 0; width: 100%;
      text-align: center;
      z-index: 20;
    }

    .sub-text { display: inline-block; padding: 6px 12px; border-radius: 8px; font-weight: 900; font-size: 1rem; text-transform: uppercase; }

    .sub-mrbeast { background: #ffe600; color: #000; }
    .sub-neon { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }
    .sub-hormozi { background: #10b981; color: #fff; }
    .sub-tiktok { background: #000; color: #fff; border: 2px solid #ff0050; }
    .sub-gradient { background: linear-gradient(90deg, #ff007f, #7928ca); color: #fff; }

    .bottom-container { width: 100%; height: 50%; background: #05050d; position: relative; }
    #asmr-canvas { position: absolute; top:0; left:0; width:100%; height:100%; }

    .btn-export-main {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none; border-radius: 12px; color: white; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>

  <div class="hero-container" id="hero-screen">
    <div class="hero-box">
      <h1>Clipfarm AI</h1>
      <p>Convert YouTube Videos into Viral Shorts in Seconds</p>
      
      <div class="input-wrapper">
        <input type="text" id="yt-url-input" placeholder="Paste YouTube Link...">
      </div>

      <button class="btn-analyze" id="analyze-btn" onclick="startAnalysis()">🚀 ANALYZE VIRAL MOMENTS</button>
    </div>
  </div>

  <div class="app-workspace" id="studio-screen">
    <div class="side-panel">
      <div>
        <div class="panel-section-title">
          <span>1. AI Viral Moments</span>
          <span style="color:var(--text-muted); font-size:0.75rem">Clips Ready</span>
        </div>
        <div class="clip-card active">
          <div style="display:flex; justify-content:space-between">
            <span style="font-weight:700">Hook #1: Viral Start</span>
            <span class="viral-badge">97% VIRAL</span>
          </div>
          <p style="font-size:0.78rem; color:var(--text-muted); margin-top:4px;">"Did you know that in 1962..."</p>
        </div>
      </div>

      <div>
        <div class="panel-section-title">2. Subtitle Styles</div>
        <div class="captions-grid">
          <button class="cap-btn selected" onclick="setCaption('mrbeast', this)">MrBeast Pop</button>
          <button class="cap-btn" onclick="setCaption('neon', this)">Neon Cyber</button>
          <button class="cap-btn" onclick="setCaption('hormozi', this)">Hormozi Bold</button>
          <button class="cap-btn" onclick="setCaption('tiktok', this)">TikTok Pop</button>
          <button class="cap-btn" onclick="setCaption('gradient', this)">Gradient Flame</button>
        </div>
      </div>

      <div>
        <div class="panel-section-title">3. Bottom Split Layout</div>
        <div class="layout-opt selected" onclick="setLayout('blur', this)">
          <span>✨</span><div><b>Ambient Blur</b></div>
        </div>
        <div class="layout-opt" onclick="setLayout('asmr', this)">
          <span>⏳</span><div><b>Kinetic Particles</b></div>
        </div>
      </div>

      <button class="btn-export-main" onclick="alert('Short processed! Link copied to clipboard.')">⚡ GENERATE & DOWNLOAD</button>
    </div>

    <div class="main-preview">
      <div class="phone-stage">
        <div class="yt-frame-container">
          <iframe id="yt-iframe" src="" allow="autoplay"></iframe>
          <div class="subtitle-overlay">
            <span class="sub-text sub-mrbeast" id="caption-preview">DISCOVER THE SECRET...</span>
          </div>
        </div>

        <div class="bottom-container">
          <canvas id="asmr-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Starry background canvas
    const bgCanvas = document.getElementById('space-bg');
    const ctx = bgCanvas.getContext('2d');
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    
    let stars = Array.from({length: 80}, () => ({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      size: Math.random() * 2,
      speed: Math.random() * 0.5 + 0.1
    }));

    function renderBg() {
      ctx.fillStyle = '#070510';
      ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      ctx.fillStyle = '#8b5cf6';
      stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.speed;
        if (s.y > bgCanvas.height) s.y = 0;
      });
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // Input toggle
    const ytInput = document.getElementById('yt-url-input');
    const analyzeBtn = document.getElementById('analyze-btn');
    ytInput.addEventListener('input', (e) => {
      analyzeBtn.style.display = e.target.value.trim() ? 'block' : 'none';
    });

    function extractVideoId(url) {
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : 'dQw4w9WgXcQ';
    }

    function startAnalysis() {
      const videoId = extractVideoId(ytInput.value);
      const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${videoId}`;
      
      document.getElementById('yt-iframe').src = embedUrl;
      document.getElementById('hero-screen').classList.add('hidden');
      document.getElementById('studio-screen').classList.add('active');
    }

    function setCaption(style, btn) {
      document.querySelectorAll('.cap-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('caption-preview').className = 'sub-text sub-' + style;
    }

    function setLayout(type, el) {
      document.querySelectorAll('.layout-opt').forEach(l => l.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
</body>
</html>
